<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BART tracker spike</title>
    <style>
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --edge: #27272a;
        --ink: #e5e7eb;
        --muted: #a1a1aa;
        --faint: #71717a;
        --sans: ui-sans-serif, system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", monospace;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        display: flex;
        gap: 16px;
        padding: 16px;
        flex-wrap: wrap;
      }
      .card {
        width: var(--w, 560px);
        height: var(--h, 400px);
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 10px 14px 0;
        font-size: 13px;
        color: var(--muted);
      }
      .head .asof {
        font: 11px var(--mono);
        color: var(--faint);
      }
      svg.map {
        display: block;
        width: 100%;
        flex: none;
      }
      .cols {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-top: 1px solid var(--edge);
        min-height: 0;
      }
      .col {
        padding: 10px 14px;
        min-width: 0;
      }
      .col + .col {
        border-left: 1px solid var(--edge);
      }
      .col h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .col h3 b {
        color: var(--ink);
        font-weight: 600;
      }
      .dep {
        display: grid;
        grid-template-columns: 4px 1fr auto;
        column-gap: 8px;
        align-items: center;
        padding: 5px 0;
      }
      .dep .bar {
        align-self: stretch;
        border-radius: 2px;
      }
      .dep .dest {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dep .arr {
        font: 11px var(--mono);
        color: var(--faint);
      }
      .dep .min {
        font: 600 20px var(--mono);
        text-align: right;
        grid-row: span 2;
      }
      .dep .min small {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        margin-left: 2px;
      }
      .dep:first-of-type .min {
        font-size: 26px;
      }
      .dep + .dep {
        border-top: 1px solid color-mix(in srgb, var(--edge) 60%, transparent);
      }
      .none {
        font-size: 12px;
        color: var(--faint);
      }
      .tip {
        position: fixed;
        pointer-events: none;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card" style="--w: 560px; --h: 400px"></div>
    <div class="card" style="--w: 400px; --h: 340px"></div>
    <div class="tip" hidden></div>
    <script>
      const SNAP = {
 "now": 1794682548,
 "from": {
  "id": "MONT",
  "name": "Montgomery Street"
 },
 "to": {
  "id": "LAFY",
  "name": "Lafayette"
 },
 "line": [
  {
   "id": "MONT",
   "name": "Montgomery Street",
   "at": 0
  },
  {
   "id": "EMBR",
   "name": "Embarcadero",
   "at": 2
  },
  {
   "id": "WOAK",
   "name": "West Oakland",
   "at": 9
  },
  {
   "id": "12TH",
   "name": "12th Street / Oakland City Center",
   "at": 14
  },
  {
   "id": "19TH",
   "name": "19th Street Oakland",
   "at": 15
  },
  {
   "id": "MCAR",
   "name": "MacArthur",
   "at": 19
  },
  {
   "id": "ROCK",
   "name": "Rockridge",
   "at": 22
  },
  {
   "id": "ORIN",
   "name": "Orinda",
   "at": 28
  },
  {
   "id": "LAFY",
   "name": "Lafayette",
   "at": 32
  }
 ],
 "trains": [
  {
   "toward": "LAFY",
   "dest": "Antioch",
   "color": "#FFFF33",
   "at": 14.9,
   "next": "19th Street Oakland",
   "nextIn": 6,
   "dwelling": false
  },
  {
   "toward": "MONT",
   "dest": "24th Street / Mission",
   "color": "#FFFF33",
   "at": 5.116666666666666,
   "next": "Embarcadero",
   "nextIn": 187,
   "dwelling": false
  },
  {
   "toward": "MONT",
   "dest": "24th Street / Mission",
   "color": "#FFFF33",
   "at": 25.78,
   "next": "Rockridge",
   "nextIn": 189,
   "dwelling": false
  }
 ],
 "departures": {
  "LAFY": [
   {
    "dest": "Antioch",
    "color": "#FFFF33",
    "leaves": 1794682888,
    "arrives": 1794684788
   },
   {
    "dest": "Antioch",
    "color": "#FFFF33",
    "leaves": 1794684088,
    "arrives": 1794685988
   },
   {
    "dest": "Antioch",
    "color": "#FFFF33",
    "leaves": 1794685288,
    "arrives": 1794687188
   }
  ],
  "MONT": [
   {
    "dest": "24th Street / Mission",
    "color": "#FFFF33",
    "leaves": 1794683257,
    "arrives": 1794685212
   },
   {
    "dest": "24th Street / Mission",
    "color": "#FFFF33",
    "leaves": 1794684457,
    "arrives": 1794686412
   },
   {
    "dest": "24th Street / Mission",
    "color": "#FFFF33",
    "leaves": 1794685657,
    "arrives": 1794687612
   }
  ]
 }
};

      // Short labels for the strip map; the full names are long.
      const SHORT = {
        "Montgomery Street": "Montgomery",
        "12th Street / Oakland City Center": "12th St",
        "19th Street Oakland": "19th St",
        "West Oakland": "W Oakland",
        "Civic Center / UN Plaza": "Civic Ctr",
        "24th Street / Mission": "24th St / Mission",
      };
      const short = (n) => SHORT[n] ?? n;
      const clock = (t) =>
        new Date(t * 1000).toLocaleTimeString("en-US", {
          hour: "numeric",
          minute: "2-digit",
          timeZone: "America/Los_Angeles",
        });
      const mins = (t) => Math.max(0, Math.round((t - SNAP.now) / 60));
      const ns = "http://www.w3.org/2000/svg";
      const el = (tag, attrs = {}, parent) => {
        const e = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        parent?.append(e);
        return e;
      };

      function render(card) {
        const W = card.clientWidth;
        const s = SNAP;
        card.innerHTML = "";
        const head = document.createElement("div");
        head.className = "head";
        head.innerHTML = `<span>${short(s.from.name)} ⇄ ${s.to.name}</span><span class="asof">${clock(s.now)}</span>`;
        card.append(head);

        // Strip map. Stations are spaced half by travel time, half evenly, so
        // the Transbay Tube reads long but 12th/19th St don't collide.
        const H = 132;
        const svg = el("svg", { class: "map", viewBox: `0 0 ${W} ${H}`, height: H }, card);
        const padL = 64,
          padR = 24,
          y = 34;
        const n = s.line.length,
          total = s.line.at(-1).at;
        const x = (at) => {
          // Piecewise: map minutes onto the blended station positions.
          const xs = s.line.map((st, i) => 0.5 * (i / (n - 1)) + 0.5 * (st.at / total));
          let k = 0;
          while (k < n - 2 && at > s.line[k + 1].at) k++;
          const a = s.line[k].at,
            b = s.line[k + 1].at;
          const f = b === a ? 0 : (at - a) / (b - a);
          return padL + (xs[k] + (xs[k + 1] - xs[k]) * f) * (W - padL - padR);
        };
        // The track. Trains heading to `to` ride above it, to `from` below.
        el("line", { x1: x(0), x2: x(total), y1: y, y2: y, stroke: "#3f3f46", "stroke-width": 6, "stroke-linecap": "round" }, svg);
        s.line.forEach((st, i) => {
          const end = i === 0 || i === n - 1;
          const cx = x(st.at);
          el("circle", { cx, cy: y, r: end ? 6 : 3.5, fill: end ? "#e5e7eb" : "#18181b", stroke: end ? "none" : "#a1a1aa", "stroke-width": 1.5 }, svg);
          const ly = y + 36;
          const t = el(
            "text",
            {
              x: cx + 3,
              y: ly,
              fill: end ? "#e5e7eb" : "#a1a1aa",
              "font-size": end ? 12 : 10.5,
              "font-weight": end ? 600 : 400,
              "text-anchor": "end",
              transform: `rotate(-35 ${cx + 3} ${ly})`,
              "font-family": "ui-sans-serif, system-ui",
            },
            svg,
          );
          t.textContent = short(st.name);
        });
        // Trains: a capsule in the line colour with an arrow, above the track
        // heading to `to`, below heading to `from`.
        for (const tr of s.trains) {
          const east = tr.toward === s.to.id;
          const cx = x(tr.at);
          const g = el("g", { transform: `translate(${cx} ${east ? y - 15 : y + 15})`, style: "cursor:default" }, svg);
          el("rect", { x: -13, y: -7, width: 26, height: 14, rx: 7, fill: tr.color, stroke: "#18181b", "stroke-width": 1.5 }, g);
          el("path", { d: east ? "M-4 -4 L3 0 L-4 4" : "M4 -4 L-3 0 L4 4", fill: "none", stroke: "#18181b", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
          g.addEventListener("pointerenter", (e) => tip(e, `${short(tr.dest)} · ${tr.dwelling ? "at" : "next"} ${short(tr.next)}${tr.dwelling ? "" : ` in ${Math.round(tr.nextIn / 60)} min`}`));
          g.addEventListener("pointerleave", () => tip());
        }

        // Departures, one column per direction.
        const cols = document.createElement("div");
        cols.className = "cols";
        for (const [to, from] of [
          [s.to, s.from],
          [s.from, s.to],
        ]) {
          const col = document.createElement("div");
          col.className = "col";
          col.innerHTML = `<h3>To <b>${short(to.name)}</b></h3>`;
          const deps = s.departures[to.id];
          if (!deps.length) col.innerHTML += `<div class="none">No direct trains soon</div>`;
          for (const d of deps) {
            const row = document.createElement("div");
            row.className = "dep";
            row.innerHTML = `<span class="bar" style="background:${d.color}"></span><span class="dest">${short(d.dest)}</span><span class="min">${mins(d.leaves)}<small>min</small></span><span></span><span class="arr">arr ${clock(d.arrives)}</span>`;
            col.append(row);
          }
          cols.append(col);
        }
        card.append(cols);
      }

      const tipEl = document.querySelector(".tip");
      function tip(e, text) {
        tipEl.hidden = !e;
        if (!e) return;
        tipEl.textContent = text;
        tipEl.style.left = e.clientX + 12 + "px";
        tipEl.style.top = e.clientY + 12 + "px";
      }
      document.querySelectorAll(".card").forEach(render);
    </script>
  </body>
</html>
