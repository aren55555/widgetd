# The widget's manifest. widgetc reads it to wire the widget up.
name    = "sports-game"
version = "0.1.0"
title   = "Game cards"
icon    = "trophy"
config  = "sportsgame.v1.Config"

# The hosts it may reach: ESPN's public API for schedules and live scores,
# ESPN's image host for team logos (the view loads those; the server never
# fetches them), and Kalshi's public market data for who's favoured to win.
[network]
hosts   = ["site.api.espn.com", "a.espncdn.com", "api.elections.kalshi.com"]
methods = ["GET"]
why     = "Schedules and live scores from ESPN, team logos, and Kalshi's odds on each game"
