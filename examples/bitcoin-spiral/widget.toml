# The widget's manifest. widgetc reads it to wire the widget up; nothing
# here is secret or Pi-specific.
name    = "bitcoin-spiral"
version = "0.1.0"
title   = "Bitcoin price spiral"
icon    = "bitcoin"
# The instance configuration message, fully qualified.
config  = "bitcoinspiral.v1.Config"

# The hosts the server half asks to reach. The host allows nothing else, and
# whoever runs it can narrow this further.
[network]
hosts   = ["api.exchange.coinbase.com", "www.bitstamp.net", "api.blockchain.info"]
methods = ["GET"]
why     = "Daily closing prices and the live BTC price (Coinbase); optional older history (Bitstamp or blockchain.info)"
