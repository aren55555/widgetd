# The widget's manifest. widgetc reads it to wire the widget up.
name    = "github-notifications"
version = "0.1.0"
title   = "GitHub notifications"
config  = "ghnotif.v1.Config"

[network]
hosts   = ["api.github.com"]
methods = ["GET"]
why     = "Your GitHub notifications"

# The display's GitHub account, with the notifications scope. The host
# signs it in (and keeps its grant to what the board's widgets use) and
# signs this widget's requests to api.github.com; the token never reaches it.
[[uses]]
provider = "github"
scopes   = ["notifications"]
