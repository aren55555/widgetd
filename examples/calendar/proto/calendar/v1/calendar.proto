syntax = "proto3";

package calendar.v1;

import "buf/validate/validate.proto";

// How much of each event the card carries. Everyone who can see the screen
// sees it.
enum Detail {
  // Full.
  DETAIL_UNSPECIFIED = 0;
  // Titles, times, place, video link, organizer, your response, a short
  // note and the guest list.
  DETAIL_FULL = 1;
  // Titles and times only.
  DETAIL_TITLES = 2;
  // Busy time only: no titles anywhere.
  DETAIL_BUSY = 3;
}

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_SUNDAY = 1;
  WEEKDAY_MONDAY = 2;
  WEEKDAY_TUESDAY = 3;
  WEEKDAY_WEDNESDAY = 4;
  WEEKDAY_THURSDAY = 5;
  WEEKDAY_FRIDAY = 6;
  WEEKDAY_SATURDAY = 7;
}

message Config {
  // The calendars to show, merged. Empty means your primary calendar.
  repeated string calendars = 1 [(buf.validate.field).repeated = {
    max_items: 10
    unique: true
    items: {string: {min_len: 1, max_len: 256}}
  }];
  // Working hours, shaded on the card. Unset means 09:00 to 17:30.
  string work_start = 2 [(buf.validate.field).string.pattern = "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"];
  string work_end = 3 [(buf.validate.field).string.pattern = "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)?$"];
  // Working days. Empty means Monday to Friday.
  repeated Weekday work_days = 4 [(buf.validate.field).repeated = {
    max_items: 7
    unique: true
    items: {enum: {defined_only: true, not_in: [0]}}
  }];
  Detail detail = 5 [(buf.validate.field).enum.defined_only = true];
}

// What you said to an invitation.
enum Response {
  RESPONSE_UNSPECIFIED = 0; // not an invitation (your own event), or unknown
  RESPONSE_NEEDS_ACTION = 1;
  RESPONSE_DECLINED = 2;
  RESPONSE_TENTATIVE = 3;
  RESPONSE_ACCEPTED = 4;
}

message WorkingHours {
  // Minutes after local midnight, on the display's clock.
  uint32 start = 1 [(buf.validate.field).uint32.lte = 1440];
  uint32 end = 2 [(buf.validate.field).uint32.lte = 1440];
  // Bit 0 is Sunday, bit 6 Saturday.
  uint32 days = 3 [(buf.validate.field).uint32.lte = 127];
}

// An all-day event: dates, not instants, so the same on every screen.
message AllDay {
  // Days since 1970-01-01.
  int32 first_day = 1;
  uint32 days = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 366}];
  // Empty at DETAIL_BUSY.
  string title = 3 [(buf.validate.field).string.max_len = 200];
}

message Guest {
  string name = 1 [(buf.validate.field).string.max_len = 120];
  Response response = 2 [(buf.validate.field).enum.defined_only = true];
  bool organizer = 3;
  // This guest is the calendar's owner (you).
  bool self = 4;
}

message Event {
  string title = 1 [(buf.validate.field).string.max_len = 200];
  // DETAIL_FULL only from here on.
  string where = 2 [(buf.validate.field).string.max_len = 200];
  string video = 3 [(buf.validate.field).string.max_len = 200];
  string organizer = 4 [(buf.validate.field).string.max_len = 120];
  // Plain text, clipped.
  string notes = 5 [(buf.validate.field).string.max_len = 320];
  Response you = 6 [(buf.validate.field).enum.defined_only = true];
  repeated Guest guests = 7 [(buf.validate.field).repeated.max_items = 30];
  // All guests, including any past the 30 sent.
  uint32 guest_count = 8;
}

// State is the whole card: one timeline in UTC, which each screen cuts into
// days in its own time zone.
message State {
  // Unix seconds; a UTC midnight. The timeline starts here.
  int64 window_start = 1;
  // The timeline's unit, in minutes (5).
  uint32 resolution_minutes = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 60}];
  WorkingHours working_hours = 3 [(buf.validate.field).required = true];
  Detail detail = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // Timed events you're going to, as packed pairs: [start − previous
  // start, duration], in resolution units from window_start, in start
  // order. Overlaps are kept, so the view can show double-booking.
  repeated uint32 busy = 5 [(buf.validate.field).repeated.max_items = 4000];
  // The same, for events you haven't said yes to, or that are marked free.
  repeated uint32 tentative = 6 [(buf.validate.field).repeated.max_items = 4000];
  repeated AllDay all_day = 7 [(buf.validate.field).repeated.max_items = 200];
  // One per span: busy's, then tentative's, in the same order. Empty at
  // DETAIL_BUSY.
  repeated Event events = 8 [(buf.validate.field).repeated.max_items = 4000];
}
