syntax = "proto3";

package widgetd.v1;

import "google/protobuf/timestamp.proto";
import "widgetd/v1/stream.proto";

option go_package = "github.com/aren55555/widgetd/gen/widgetd/v1;widgetdv1";

// WidgetAdminService manages what runs. Screens (paired devices) may add a
// placeholder and ask for a configuration QR code; everything that changes
// a running instance's configuration, its network access, or which
// instances exist needs an admin's passkey session, which in practice means
// a phone that scanned a QR code.
service WidgetAdminService {
  // Installed widgets. Screen or admin.
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse);

  // Add an unconfigured instance of a widget. Screen or admin. It appears on
  // every screen as a placeholder until it's configured.
  rpc AddInstance(AddInstanceRequest) returns (AddInstanceResponse);

  // A one-time, short-lived link to configure one instance. Screen or
  // admin. The screen shows it as a QR code; the link alone grants nothing:
  // saving needs an admin session.
  rpc RequestConfigTicket(RequestConfigTicketRequest) returns (RequestConfigTicketResponse);

  // What the configuration page needs to render its form. Admin. The
  // instance is named by a ticket (a phone that scanned a screen's QR code)
  // or directly by id (the admin page's "Settings" link).
  rpc GetConfigForm(GetConfigFormRequest) returns (GetConfigFormResponse);

  // Choices for the form's fields, given the settings as edited so far:
  // the widget's server half answers them (a team list for the league
  // picked, say). Admin.
  rpc GetConfigChoices(GetConfigChoicesRequest) returns (GetConfigChoicesResponse);

  // Check and save a configuration, then (re)start the instance. Admin.
  rpc SaveConfig(SaveConfigRequest) returns (SaveConfigResponse);

  // Admin.
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc RenameInstance(RenameInstanceRequest) returns (RenameInstanceResponse);
  rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse);

  // A widget's network grant, and an instance's recent fetches. Admin.
  rpc SetNetworkGrant(SetNetworkGrantRequest) returns (SetNetworkGrantResponse);
  rpc GetInstanceActivity(GetInstanceActivityRequest) returns (GetInstanceActivityResponse);

  // Sign-in, for widgets that use an account (device flow: a code shown
  // on the screen, approved on the provider's site from a phone).
  // BeginSignIn: screen or admin, but a screen only for an instance that
  // isn't signed in yet; replacing a sign-in needs an admin. The rest:
  // admin.
  rpc BeginSignIn(BeginSignInRequest) returns (BeginSignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // The OAuth app a widget signs in with, registered by whoever runs the
  // host with the provider.
  rpc SetSignInClient(SetSignInClientRequest) returns (SetSignInClientResponse);
}

message WidgetInfo {
  string name = 1;
  string version = 2;
  string title = 3;
  // What the widget asks to reach, and why.
  repeated string requested_hosts = 4;
  repeated string requested_methods = 5;
  string network_why = 6;
  // What it has been granted. Unset `granted_hosts` with `grant_set` false
  // means "everything requested".
  bool grant_set = 7;
  repeated string granted_hosts = 8;
  bool network_disabled = 9;
  // Whether it takes a configuration at all.
  bool configurable = 10;
  // Set if it signs in to an account: the provider's name, and whether a
  // client (OAuth app) has been registered for it yet.
  string sign_in_provider = 11;
  bool sign_in_client_set = 12;
}

message ListWidgetsRequest {}

message ListWidgetsResponse {
  repeated WidgetInfo widgets = 1;
}

message AddInstanceRequest {
  string widget = 1;
}

message AddInstanceResponse {
  string instance_id = 1;
}

message RequestConfigTicketRequest {
  string instance_id = 1;
}

message RequestConfigTicketResponse {
  // What the QR code encodes: <public url><base>configure/<ticket>.
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetConfigFormRequest {
  // One of these. A ticket wins if both are set.
  string ticket = 1;
  string instance_id = 2;
}

message GetConfigFormResponse {
  string instance_id = 1;
  WidgetInfo widget = 2;
  string label = 3;
  // The fully qualified Config message, in `schema`. Empty if the widget
  // takes no configuration (the page then only names and starts it).
  string config_type = 4;
  // google.protobuf.FileDescriptorSet: the widget's protos and imports.
  bytes schema = 5;
  // The current configuration, encoded as config_type. Empty for a new one.
  // Secret fields are always empty here: they are write-only.
  bytes config = 6;
  InstanceStatus status = 7;
  // The widget's secret fields (top-level strings), and which of them have
  // a value stored. The form shows them as write-only.
  repeated string secret_fields = 8;
  repeated string secrets_set = 9;
}

message SaveConfigRequest {
  // One of these, as in GetConfigFormRequest. Saving consumes a ticket.
  string ticket = 1;
  string instance_id = 4;
  string label = 2;
  // Encoded as the widget's Config message. A secret field left empty
  // keeps its stored value.
  bytes config = 3;
  // Secret fields to remove instead.
  repeated string clear_secrets = 5;
}

message FieldViolation {
  // Dotted field path, e.g. "teams[0].league"; empty for the whole message.
  string field = 1;
  string message = 2;
}

message SaveConfigResponse {
  // Empty means saved and started; otherwise nothing changed.
  repeated FieldViolation violations = 1;
}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated InstanceInfo instances = 1;
}

message InstanceInfo {
  string id = 1;
  string widget = 2;
  string label = 3;
  InstanceStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message RenameInstanceRequest {
  string instance_id = 1;
  string label = 2;
}

message RenameInstanceResponse {}

message DeleteInstanceRequest {
  string instance_id = 1;
}

message DeleteInstanceResponse {}

message SetNetworkGrantRequest {
  string widget = 1;
  // Hosts granted, each from the widget's request. Ignored with `use_default`.
  repeated string hosts = 2;
  bool disabled = 3;
  // Back to the default: everything the widget requests.
  bool use_default = 4;
}

message SetNetworkGrantResponse {}

message GetInstanceActivityRequest {
  string instance_id = 1;
}

message Fetch {
  google.protobuf.Timestamp at = 1;
  string method = 2;
  string host = 3;
  string path = 4;
  int32 status = 5;
  int64 bytes = 6;
  string denied = 7;
  string error = 8;
  int64 duration_ms = 9;
}

message GetInstanceActivityResponse {
  repeated Fetch fetches = 1;
}

message GetConfigChoicesRequest {
  // Which instance: a QR code's ticket, or (from the admin page) its id.
  string ticket = 1;
  // The settings as edited so far, encoded as the widget's Config.
  bytes config = 2;
  string instance_id = 3;
}

message ConfigChoice {
  string value = 1;
  string label = 2;
}

message ConfigFieldChoices {
  string field = 1;
  repeated ConfigChoice choices = 2;
}

message GetConfigChoicesResponse {
  repeated ConfigFieldChoices fields = 1;
}

message BeginSignInRequest {
  string instance_id = 1;
}

message BeginSignInResponse {
  // Show this, and where to enter it.
  string user_code = 1;
  string verification_uri = 2;
  // The same page with the code filled in, if the provider offers one:
  // what a QR code should open.
  string verification_uri_complete = 3;
  google.protobuf.Timestamp expires_at = 4;
  string provider = 5;
}

message SignOutRequest {
  string instance_id = 1;
}

message SignOutResponse {}

message SetSignInClientRequest {
  string widget = 1;
  string client_id = 2;
  // Optional: device flow with most providers needs none. Write-only.
  string client_secret = 3;
}

message SetSignInClientResponse {}
