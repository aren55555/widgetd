syntax = "proto3";

package widgetd.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aren55555/widgetd/gen/widgetd/v1;widgetdv1";

// WidgetStreamService is the one pipe every card on a screen shares. A screen
// opens a single StreamWidgets call and receives every card's lifecycle and
// data over it; there is never a connection per widget.
service WidgetStreamService {
  rpc StreamWidgets(StreamWidgetsRequest) returns (stream StreamWidgetsResponse);

  // A tap, a choice, a dismissal: something a viewer did on a card, sent
  // to the widget's server half. Screen or admin. The value must be the
  // card's declared action type, and pass its rules.
  rpc SendAction(SendActionRequest) returns (SendActionResponse);
}

message SendActionRequest {
  string card_id = 1;
  string type_url = 2;
  bytes value = 3;
}

message SendActionResponse {}

// Cursor orders the updates of one card. `seq` increases with every snapshot
// or delta; `epoch` changes whenever the instance behind the card restarts,
// which invalidates every cursor issued before it.
message Cursor {
  uint64 epoch = 1;
  uint64 seq = 2;
}

// Resume tells the server what the client already holds for a card, so a
// reconnect or reload is sent only what changed.
message Resume {
  string card_id = 1;
  // Digest of the widget build the cached state was produced by. A different
  // build may use a different schema, so the server ignores the cursor.
  string digest = 2;
  Cursor cursor = 3;
}

message StreamWidgetsRequest {
  repeated Resume resume = 1;
}

// An unset `frame` is a keepalive: one is sent as soon as the stream opens and
// then periodically while it is idle.
message StreamWidgetsResponse {
  WidgetFrame frame = 1;
}

message WidgetFrame {
  // The configured instance the card belongs to.
  string instance_id = 1;
  // What is on screen. Always prefixed by `instance_id` + "/". Empty for
  // `instance`, which is about the instance rather than any one card.
  string card_id = 2;

  oneof body {
    Mounted mounted = 3;
    Payload snapshot = 4;
    Payload delta = 5;
    Unmounted unmounted = 6;
    Fault fault = 7;
    // An instance appeared, changed state, or (with `removed`) was deleted.
    // Sent for every instance in the initial burst, then on each change, so
    // a screen can show an instance that has no cards: one waiting to be
    // configured, say.
    InstanceStatus instance = 8;
  }
}

message InstanceStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Added, but its configuration hasn't been saved yet.
    STATE_NEEDS_CONFIG = 1;
    // Running; its cards are whatever it has mounted.
    STATE_RUNNING = 2;
    // Stopped by an error and waiting to restart; `message` says why.
    STATE_FAULTED = 3;
    // Its stored configuration no longer passes the widget's schema (after
    // an upgrade, say). It waits to be configured again.
    STATE_INVALID_CONFIG = 4;
    // The widget needs an account signed in (or signed in again: the
    // provider stopped accepting its token). Screens offer a sign-in code.
    STATE_NEEDS_SIGN_IN = 5;
  }
  State state = 1;
  string widget = 2;
  // What the instance is called: its label, else the widget's title.
  string title = 3;
  string message = 4;
  bool removed = 5;
  // For STATE_NEEDS_SIGN_IN: which account (provider) to sign in.
  string provider = 6;
  // Something wrong that doesn't stop it, e.g. it used a scope it didn't
  // declare. Screens badge its cards.
  string warning = 7;
  // For STATE_NEEDS_SIGN_IN: the account bound to it (empty: none chosen
  // yet, which only an admin can do) and that account's name.
  string account = 8;
  string account_label = 9;
}

message WidgetRef {
  string name = 1;
  string version = 2;
  // Content digest of the widget build. Changes with any change to its view
  // or schema, so it is safe to cache the view bundle under it forever.
  string digest = 3;
}

// Mounted announces a card. It is always sent before the card's first payload.
message Mounted {
  WidgetRef widget = 1;
  // Where the card's sandboxed frame document is served.
  string frame_url = 2;
  // Fully qualified names of the card's message types. A payload whose
  // type_url names anything else is refused by the view.
  string state_type = 3;
  string delta_type = 4;
  Layout layout = 5;
  // When the host will unmount the card on its own, if ever.
  google.protobuf.Timestamp visible_until = 6;
  string title = 7;
  // The message a card accepts from viewers; empty if it takes none.
  string action_type = 8;
}

// Layout is a size hint in grid units.
message Layout {
  uint32 cols = 1;
  uint32 rows = 2;
}

message Payload {
  // "type.googleapis.com/<full name>", as in google.protobuf.Any.
  string type_url = 1;
  bytes value = 2;
  Cursor cursor = 3;
  // For a delta: the cursor it applies on top of. A client whose cursor isn't
  // this one has missed something and must resync.
  Cursor prev = 4;
}

message Unmounted {
  // The card is gone for good (instance deleted, not merely expired from
  // view), so any state cached for it should be discarded.
  bool purge = 1;
}

message Fault {
  string message = 1;
}
