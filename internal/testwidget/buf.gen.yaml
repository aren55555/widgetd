version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/aren55555/widgetd/internal/testwidget/gen
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: gen
    opt: paths=source_relative
  # The same schema for the web SDK's tests, with buf/validate included so
  # the generated file's import resolves.
  - local: [bun, ../../client/node_modules/.bin/protoc-gen-es]
    out: ../../sdk/web/test/gen
    include_imports: true
    opt:
      - target=ts
